[project]
name = "augur"
version = "0.1.0"
description = "Local Stellaris campaign intelligence for Claude Code — no API key, no MCP server"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["stellaris", "claude-code", "savegame", "parser"]

# Deliberately small. The upstream project pulled in google-genai, mcp,
# fastapi, uvicorn and pydantic to talk to a paid model endpoint and to speak
# JSON-RPC at an MCP client. Claude Code is the model and the shell is the
# transport, so none of that is needed here.
dependencies = [
    "orjson>=3.9.0",
    "watchdog>=3.0",
]

[project.scripts]
augur = "augur.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["augur*"]
exclude = ["tests*", "stellaris-parser*"]

[tool.setuptools.package-data]
"augur.knowledge" = ["patches/*.md", "patches/**/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501", "E721", "E731", "E741",
    "B007", "B008", "B017", "B904",
    "SIM102", "SIM105", "SIM108", "SIM117",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "integration: needs a real .sav and the built Rust parser",
    "slow: deselect with -m 'not slow'",
]
